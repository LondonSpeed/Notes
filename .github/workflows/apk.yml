name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Publish APK to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk notebook.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest notebook.apk --title "Notebook (latest APK)" --notes "Debug APK built from commit ${{ github.sha }}"
