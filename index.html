<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root{--bg:#f2f2f7;--surf:#fff;--ink:#1c1c1e;--mute:#6e6e73;--line:#e2e2e7;--acc:#a8680f;--accbg:#fbefd9;--danger:#a23b3b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--surf:#1c1c1e;--ink:#f2f2f7;--mute:#98989f;--line:#2e2e32;--acc:#f5b942;--accbg:#33290f;--danger:#e08a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0c;--surf:#1c1c1e;--ink:#f2f2f7;--mute:#98989f;--line:#2e2e32;--acc:#f5b942;--accbg:#33290f;--danger:#e08a8a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;padding:8px 0;color:var(--mute);font-size:11px;border-radius:8px;position:relative}
nav button.on{color:var(--acc);font-weight:600}
nav .badge{font-size:11px;background:var(--acc);color:var(--bg);border-radius:9px;padding:0 6px;margin-left:3px}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:20px 18px 110px}
h1,h2,.serif{font-family:Newsreader,Georgia,serif;font-weight:500}
h1{font-size:32px;line-height:1.15;margin:8px 0 18px}
h2{font-size:21px;margin:28px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.top .brand{font-family:Newsreader,serif;font-size:18px;color:var(--ink)}
.ib{padding:6px 10px;border-radius:8px;color:var(--mute)}.ib:hover{background:var(--accbg)}
.cap{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px}
.cap textarea{width:100%;min-height:110px;border:0;background:none;resize:vertical;font:18px/1.55 Newsreader,Georgia,serif;outline:none}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--bg);padding:9px 18px;border-radius:10px;font-weight:600}
.btn2{border:1px solid var(--line);padding:8px 14px;border-radius:10px;color:var(--ink)}
.btn2.danger{color:var(--danger)}
.item{display:block;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line)}
.item .t{font:500 18px/1.3 Newsreader,Georgia,serif}
.item .s{color:var(--mute);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{color:var(--mute);font-size:12px;margin-top:4px}
.empty{color:var(--mute);padding:18px 0;font-family:Newsreader,serif;font-size:17px;font-style:italic}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.tile b{display:block;font:500 24px Newsreader,serif}.tile span{color:var(--mute);font-size:13px}
input.f,select.f{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sheet{position:fixed;inset:0 0 calc(62px + env(safe-area-inset-bottom,0px)) 0;background:var(--bg);z-index:10;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .in{max-width:720px;margin:0 auto;padding:14px 18px 140px}
.ttl{width:100%;border:0;background:none;outline:none;font:500 28px/1.2 Newsreader,Georgia,serif;margin:14px 0 6px}
.body{width:100%;min-height:42vh;border:0;background:none;outline:none;resize:none;font:18px/1.65 Newsreader,Georgia,serif}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.photos div{position:relative}.photos img{height:110px;border-radius:10px;display:block}
.photos button{position:absolute;top:4px;right:4px;background:#000a;color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.saved{color:var(--mute);font-size:12px}
.tools{position:sticky;top:0;background:var(--bg);display:flex;gap:2px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line);z-index:2}
.tb{min-width:36px;height:34px;border-radius:8px;padding:0 9px;font-size:14px}.tb:hover{background:var(--accbg)}
div.body{padding:8px 0;overflow-wrap:anywhere}div.body h3{font:500 24px/1.25 Newsreader,Georgia,serif;margin:10px 0 4px}div.body ul{padding-left:24px;margin:6px 0}
.ck{padding:2px 0}.ck.on{color:var(--mute);text-decoration:line-through}
.cb{display:inline-block;width:18px;height:18px;border:2px solid var(--mute);border-radius:5px;vertical-align:-3px;margin-right:9px;cursor:pointer;text-decoration:none}
.ck.on .cb{background:var(--acc);border-color:var(--acc)}.ck.on .cb::after{content:'';display:block;width:4px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 0 0 4px}
#toast{position:fixed;z-index:30;bottom:calc(74px + env(safe-area-inset-bottom,0px));right:12px;left:12px;max-width:420px;margin-left:auto;background:var(--surf);border:1px solid var(--acc);border-radius:14px;padding:14px 16px}
#toast[hidden]{display:none}
#fab,#fabc{position:fixed;right:18px;z-index:15;border-radius:50%;background:var(--acc);color:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.25)}
#fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;font-size:30px;line-height:1}
#fabc{bottom:calc(142px + env(safe-area-inset-bottom,0px));width:42px;height:42px;right:25px;font-size:20px;background:var(--surf);color:var(--acc);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.grid .item{border:1px solid var(--line);border-radius:12px;padding:12px}
.c1{background:rgba(255,214,10,.17)}.c2{background:rgba(70,190,110,.17)}.c3{background:rgba(70,140,255,.17)}.c4{background:rgba(255,95,150,.17)}.c5{background:rgba(160,110,255,.18)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surf)}.dot.c1{background:#e6c74c}.dot.c2{background:#6cc58a}.dot.c3{background:#6a9ff0}.dot.c4{background:#ee79a5}.dot.c5{background:#a98af0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.fc{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px}.fc.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;font-size:13px}.chip button,.chip a{padding:4px 11px;color:var(--acc);text-decoration:none}.chip a{border-left:1px solid var(--line);font-weight:600}
a.nl{color:var(--acc);text-decoration:underline;cursor:pointer}
.item{padding:11px 2px}.item .s{-webkit-line-clamp:1}.th{float:right;width:44px;height:44px;object-fit:cover;border-radius:8px;margin-left:10px}
.gh{font:500 13px Inter,sans-serif;color:var(--mute);margin:18px 0 2px}.sh h2{margin:20px 0 4px;font-size:19px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.cover{text-align:left;min-height:120px;border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px 14px 14px 6px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background-color:var(--surf)}.cover .cn{font-size:20px;line-height:1.2}
.cover.add{border-left-width:1px;border-style:dashed;align-items:center;justify-content:center;color:var(--mute)}
.sug{padding:6px 2px 10px;border-bottom:1px solid var(--line)}
.chip small{color:var(--mute);margin-left:5px;font-size:12px}
#pick{position:fixed;inset:0 0 calc(62px + env(safe-area-inset-bottom,0px)) 0;background:var(--bg);padding:18px;overflow:auto;z-index:5}
#snack{position:fixed;z-index:30;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:360px;margin:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;justify-content:space-between;align-items:center}#snack[hidden]{display:none}#snack .btn2{color:var(--bg);border-color:var(--bg)}
.pill{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:12px}
.day{display:flex;align-items:center;gap:8px;margin-bottom:6px}
textarea.x{width:100%;height:50vh;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace}
@media(min-width:860px){
 nav{top:0;bottom:auto;right:auto;width:190px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:70px 12px}
 nav button{flex:none;text-align:left;font-size:15px;padding:10px 12px}
 main{margin-left:230px;max-width:760px;padding-bottom:60px}
 .app{display:block}
 .sheet{inset:0 0 0 190px}
 #toast{left:210px}
 #pick{left:190px}
 #fab{bottom:24px}#fabc{bottom:90px}
}
/* v2: Apple Notes-like look */
h1{font:700 32px/1.15 Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.02em;margin:8px 0 14px}
h2{font:700 20px/1.2 Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.01em}
.sh h2{font-size:19px;margin:20px 2px 8px}
.gh{font:700 17px Inter,system-ui,sans-serif;color:var(--ink);margin:22px 2px 8px}
nav{background:color-mix(in srgb,var(--surf) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.item{display:block;width:100%;text-align:left;background:var(--surf);padding:10px 14px;border:0;border-radius:0;margin:0;position:relative}
.item:not(.item+.item){border-radius:12px 12px 0 0}
.item:not(:has(+.item)){border-radius:0 0 12px 12px}
.item:not(.item+.item):not(:has(+.item)){border-radius:12px}
.item+.item::before{content:'';position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.item .t{font:600 16px/1.3 Inter,system-ui,-apple-system,sans-serif}
.nc{display:flex;align-items:center;gap:10px}
.nc .tx{min-width:0;flex:1}
.nc .t,.nc .s,.nc .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .s{font-size:14px;margin-top:1px}
.item .s .dt{color:var(--ink);margin-right:7px}
.item .m{font-size:12px;margin-top:2px}
.nc .th{float:none;margin:0;width:42px;height:42px;border-radius:6px;flex:none}
.item.c1{box-shadow:inset 3px 0 0 #e6c74c}.item.c2{box-shadow:inset 3px 0 0 #6cc58a}.item.c3{box-shadow:inset 3px 0 0 #6a9ff0}.item.c4{box-shadow:inset 3px 0 0 #ee79a5}.item.c5{box-shadow:inset 3px 0 0 #a98af0}
.sug{padding:6px 14px 12px;border-bottom:0;margin-bottom:6px}
.cap textarea{font:17px/1.55 Inter,system-ui,-apple-system,sans-serif}
.ttl{font:700 26px/1.2 Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.01em}
.body{font:17px/1.6 Inter,system-ui,-apple-system,sans-serif}
div.body h3{font:700 21px/1.25 Inter,system-ui,-apple-system,sans-serif}
/* v3: icons, Keep, colours */
nav button svg{width:24px;height:24px;display:block;margin:0 auto}
.ic{width:22px;height:22px;display:block}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:38px;position:relative}
.ib.tg{color:var(--acc);background:var(--accbg)}.ib.danger{color:var(--danger)}
.acts{gap:4px}
.bdg{position:absolute;top:2px;right:0;background:var(--acc);color:var(--bg);font-size:10px;border-radius:9px;padding:0 5px;line-height:15px}
.dd{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--line);margin-right:7px}
.dd.c1{background:#e6c74c}.dd.c2{background:#6cc58a}.dd.c3{background:#6a9ff0}.dd.c4{background:#ee79a5}.dd.c5{background:#a98af0}
.dot{flex:none}.dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.sheet.c1{background:color-mix(in srgb,#e6c74c 24%,var(--bg))}.sheet.c2{background:color-mix(in srgb,#6cc58a 24%,var(--bg))}.sheet.c3{background:color-mix(in srgb,#6a9ff0 24%,var(--bg))}.sheet.c4{background:color-mix(in srgb,#ee79a5 24%,var(--bg))}.sheet.c5{background:color-mix(in srgb,#a98af0 24%,var(--bg))}
.sheet .tools{background:transparent;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet.keep .nbsel{display:none}
.kg{columns:2;column-gap:10px}
.kc{display:block;width:100%;break-inside:avoid;margin:0 0 10px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surf)}
.kc.c1{background:color-mix(in srgb,#e6c74c 30%,var(--surf))}.kc.c2{background:color-mix(in srgb,#6cc58a 30%,var(--surf))}.kc.c3{background:color-mix(in srgb,#6a9ff0 30%,var(--surf))}.kc.c4{background:color-mix(in srgb,#ee79a5 30%,var(--surf))}.kc.c5{background:color-mix(in srgb,#a98af0 30%,var(--surf))}
.kc .kt{font:700 16px/1.3 Inter,system-ui,sans-serif;margin-bottom:4px}
.kc .kb{max-height:170px;overflow:hidden;font-size:14px;line-height:1.45;pointer-events:none;overflow-wrap:anywhere}
.kc .m{color:var(--mute);font-size:12px;margin-top:6px}.kc .m .ic{width:14px;height:14px;display:inline;vertical-align:-2px}
@media(min-width:860px){.kg{columns:3}nav button svg{margin:0}}
#planov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#planov[hidden]{display:none}#planov iframe{flex:1;width:100%;border:0;background:var(--bg)}#planov .pb{padding:2px 6px}
</style>
</head>
<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" hidden role="alert"></div><div id="snack" hidden></div>
<button id="fabc" data-act="fabck" aria-label="New checklist">☐</button><button id="fab" data-act="fab" aria-label="New note">+</button>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dk(new Date());
const IP={home:'<path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10"/>',book:'<path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3V4.5zM5 17a3 3 0 0 1 3-3h11"/>',notes:'<path d="M6 3.5h8.5L19 8v12.5H6zM14 3.5V8h5M9 13h7M9 16.5h7"/>',keep:'<path d="M9.5 18h5M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',down:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/>',plus:'<path d="M12 5v14M5 12h14"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',arch:'<path d="M4 5h16v4H4zM5.5 9v10h13V9M10 13h4"/>',pin:'<path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',back:'<path d="M15 5l-7 7 7 7"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',bible:'<path d="M12 7c-1.8-1.6-4.6-2.2-8-2v13c3.4-.2 6.2.4 8 2 1.8-1.6 4.6-2.2 8-2V5c-3.4-.2-6.2.4-8 2zM12 7v13"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[k]}</svg>`;
function fs(iso){const d=new Date(iso),t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);const k=dk(d);if(k===dk(t))return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});if(k===dk(y))return 'Yesterday';if(t-d<6*864e5)return d.toLocaleDateString(undefined,{weekday:'long'});return d.toLocaleDateString(undefined,{day:'numeric',month:'numeric',year:'2-digit'})}
const fmt=iso=>new Date(iso).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let D;
try{D=JSON.parse(localStorage.getItem('nb1'))}catch(e){}
D=D||{notes:[],cols:[{id:'c1',name:'Personal'},{id:'c2',name:'Bible research'},{id:'c3',name:'Ideas'}]};
D.trash=(D.trash||[]).filter(x=>Date.now()-new Date(x.deletedAt)<30*864e5);
let theme='';try{theme=localStorage.getItem('nbTheme')||''}catch(e){}
if(theme)document.documentElement.dataset.theme=theme;
const S={view:'home',col:null,day:today(),q:'',ed:null,photos:[],f:{}};
let tm;
function save(){try{localStorage.setItem('nb1',JSON.stringify(D));syncRem();const e=$('#sv');if(e)e.textContent='Saved'}catch(e){alert('Storage is full. Export your notes and remove some photos.')}}
const title=n=>n.title||(n.body||'').split('\n')[0].slice(0,60)||'Untitled';
const colName=id=>(D.cols.find(c=>c.id===id)||{}).name;
const live=()=>D.notes.filter(n=>!n.archived);
const sortN=a=>a.slice().sort((x,y)=>(y.pinned-x.pinned)||y.created.localeCompare(x.created));
const inbox=()=>live().filter(n=>!n.col&&n.type==='note');
function newNote(o){const n=Object.assign({id:uid(),title:'',body:'',created:new Date().toISOString(),type:'note',col:null,pinned:false,archived:false,photos:[]},o);D.notes.push(n);save();return n}
function prog(n){const h=n.html||'',t=(h.match(/class="ck/g)||[]).length;return t?' · '+(h.match(/class="ck on/g)||[]).length+'/'+t+' done':''}
function card(n){const t=title(n),b=n.title?(n.body||''):(n.body||'').split('\n').slice(1).join(' '),pv=b.replace(/\s+/g,' ').trim(),due=n.remind&&!n.done,
 fl=[n.col?esc(colName(n.col))+(n.topic?' › '+esc(n.topic):''):'',n.upnow?'Up Now':'',n.type==='journal'?'Journal':'',due?'Reminder '+fmt(n.remind)+(n.remind<=new Date().toISOString()?' (due)':''):'',prog(n).replace(' · ',''),n.archived?'Archived':''].filter(Boolean).join(' · ');
 return `<button class="item nc ${n.color||''}" data-open="${n.id}"><div class="tx"><div class="t">${esc(t)}</div><div class="s"><span class="dt">${esc(fs(n.created))}</span>${pv?esc(pv):'<i>No additional text</i>'}</div>${fl?`<div class="m">${fl}</div>`:''}</div>${n.photos.length?`<img class="th" src="${n.photos[0]}" alt="">`:''}</button>`}

 return topbar()+'<button class="ib" data-go="library">‹ Notebooks</button><h1>Connections</h1><p class="saved">The strongest links the app found between your notes. Connect the ones that matter. Rejected pairs stay hidden.</p>'+(rows.length?rows.map(o=>`<div class="item"><div class="t">${esc(title(o.a))} ↔ ${esc(title(o.b))}</div><div class="m">${esc(o.why)} · ${esc(nb(o.a))} / ${esc(nb(o.b))}</div><div class="bar"><button class="btn2" data-act="conn" data-a="${o.a.id}" data-b="${o.b.id}">Connect</button><button class="btn2" data-act="nocon" data-a="${o.a.id}" data-b="${o.b.id}">Not related</button></div></div>`).join(''):'<div class="empty">No new connections to review.</div>')}
var rsig='',NERR='';
const LN=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?Capacitor.Plugins.LocalNotifications:null;
const nid=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2e9+1};
async function syncRem(){if(!LN)return;const l=D.notes.filter(n=>n.remind&&!n.done&&!n.archived&&new Date(n.remind)>new Date()),sig=l.map(n=>n.id+n.remind).join();if(sig===rsig)return;
 try{const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications.map(x=>({id:x.id}))});
 if(l.length)await LN.schedule({notifications:l.map(n=>({id:nid(n.id),title:'Reminder',body:title(n),channelId:'reminders',schedule:{at:new Date(n.remind),allowWhileIdle:true},extra:{nid:n.id}}))});rsig=sig}catch(e){NERR=String(e&&e.message||e)}}
function openPlan(){const o=$('#planov'),f=o.querySelector('iframe');if(!f.getAttribute('src')&&!f.srcdoc)f.src='plan.html';o.hidden=false}
async function nTest(){const o=$('#nout');if(!LN){o.textContent='Native notifications are only available in the Android app.';return}
 try{const p=await LN.checkPermissions(),x=LN.checkExactNotificationSetting?await LN.checkExactNotificationSetting():{};
 await LN.createChannel({id:'reminders',name:'Reminders',importance:4,vibration:true,visibility:1});
 await LN.schedule({notifications:[{id:1,title:'Test',body:'Notification works',channelId:'reminders',schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true}}]});
 const q=await LN.getPending();o.textContent='Permission: '+p.display+' · exact alarms: '+(x.exact_alarm||'unknown')+' · scheduled: '+q.notifications.length+(NERR?' · last error: '+NERR:'')+'. Close the app now. A test notification should arrive in about 10 seconds.'}catch(e){o.textContent='Error: '+String(e&&e.message||e)}}
async function initNative(){if(!LN)return;try{await LN.createChannel({id:'reminders',name:'Reminders',importance:4,vibration:true,visibility:1});
 LN.addListener('localNotificationActionPerformed',e=>{const i=e.notification.extra&&e.notification.extra.nid;if(i&&D.notes.some(n=>n.id===i))openNote(i)});await LN.requestPermissions()}catch(e){}syncRem()}
window.addEventListener('pagehide',()=>{clearTimeout(tm);if(S.ed)save()});
render();initNative();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
