$("pl").innerHTML=h;$("pq").innerHTML=`<option value="">${t.preQ}</option>`+N[S.lang].map((n,i)=>`<option value="${i}">${n}</option>`).join("");
for(let b=0;b<CH.length;b++)syncPre(b)}
function syncPre(b){const d=$("pl").children[b],ig=d.querySelectorAll(".chs input");let n=0;ig.forEach(i=>{const on=!!S.pre[i.dataset.g];i.checked=on;if(on)n++});
const bk=d.querySelector(".bk");bk.checked=n==CH[b];bk.indeterminate=n>0&&n<CH[b];d.querySelector("summary .mu").textContent=n?n+"/"+CH[b]:""}
function syncAll(){for(let b=0;b<CH.length;b++)syncPre(b)}
function setPre(g,v){if(v)S.pre[g]=1;else delete S.pre[g]}
function prePick(){save();delete cache.cover;render()}
$("pl").onchange=e=>{const c=e.target;if(c.classList.contains("bk")){const b=+c.dataset.b;for(let k=0;k<CH[b];k++)setPre(OFF[b]+k,c.checked);syncPre(b)}else if(c.dataset.g!==undefined){const g=+c.dataset.g;setPre(g,c.checked);syncPre(OFF.findIndex((o,i)=>g>=o&&g<o+CH[i]))}else return;prePick()};
$("pq").onchange=e=>{if(e.target.value==="")return;const n=+e.target.value;for(let g=0;g<OFF[n];g++)S.pre[g]=1;e.target.value="";syncAll();prePick()};
$("pc").onclick=()=>{S.pre={};syncAll();prePick()};
$("lang").onchange=e=>{S.lang=e.target.value;save();ui()};
$("th").onclick=()=>{S.theme=S.theme=="dark"?"light":"dark";save();ui()};
$("mode").onchange=e=>{S.mode=e.target.value;save();ui()};
document.querySelectorAll("input[name=dm]").forEach(r=>r.onchange=e=>{S.dm=e.target.value;if(S.dm=="date")S.end=fmt(calc().e);save();ui()});
$("wk").oninput=e=>{S.weeks=Math.min(200,Math.max(1,+e.target.value||1));save();render()};
$("st").onchange=e=>{if(e.target.value){S.start=e.target.value;save();render()}};
$("en").onchange=e=>{if(e.target.value){S.end=e.target.value;save();render()}};
$("list").onchange=e=>{const c=e.target;if(!c.dataset.a)return;const p=P[S.mode]=P[S.mode]||{},U=parts(S.mode);for(let k=+c.dataset.a;k<=+c.dataset.b;k++){if(c.checked)p[U[k].g]=1;else delete p[U[k].g]}save();render()};
$("rz").onclick=()=>{if(confirm(T[S.lang].conf)){delete P[S.mode];save();render()}};
$("bk").onclick=async()=>{const json=JSON.stringify({v:1,s:S,p:P}),name="piibel_varukoopia_"+fmt(new Date())+".json",C=window.Capacitor,pl=(C&&C.Plugins)||{};
if(C&&C.isNativePlatform&&C.isNativePlatform()){try{if(!pl.Filesystem||!pl.Share)throw new Error("no plugin");
const r=await pl.Filesystem.writeFile({path:name,data:json,directory:"CACHE",encoding:"utf8"});
await pl.Share.share({title:name,dialogTitle:name,url:r.uri});return}catch(e){if(/cancel/i.test(String(e&&e.message||e)))return;
try{await navigator.clipboard.writeText(json);alert(T[S.lang].copied)}catch(x){alert(T[S.lang].bkerr)}return}}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()};
$("rs").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.p)throw 0;P=d.p;S=Object.assign(def(),d.s||{});save();ui();alert(T[S.lang].ok)}catch(x){alert(T[S.lang].err)}};r.readAsText(f);e.target.value=""};
function route(){const s=location.hash=="#settings";$("vm").hidden=s;$("vs").hidden=!s;window.scrollTo(0,0)}
function closeS(){if(history.length>1)history.back();else{location.hash="";route()}}
$("gs").onclick=()=>{location.hash="settings"};$("bkb").onclick=closeS;$("bkb2").onclick=closeS;
window.addEventListener("hashchange",route);
ui();route();

</script></body></html>
