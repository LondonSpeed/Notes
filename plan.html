$("lang").onchange=e=>{S.lang=e.target.value;save();ui()};
$("th").onclick=()=>{S.theme=S.theme=="dark"?"light":"dark";save();ui()};
$("mode").onchange=e=>{S.mode=e.target.value;save();ui()};
document.querySelectorAll("input[name=dm]").forEach(r=>r.onchange=e=>{S.dm=e.target.value;if(S.dm=="date")S.end=fmt(calc().e);save();ui()});
$("wk").oninput=e=>{S.weeks=Math.min(200,Math.max(1,+e.target.value||1));save();render()};
$("st").onchange=e=>{if(e.target.value){S.start=e.target.value;save();render()}};
$("en").onchange=e=>{if(e.target.value){S.end=e.target.value;save();render()}};
$("list").onchange=e=>{const c=e.target;if(!c.dataset.a)return;const p=P[S.mode]=P[S.mode]||{};for(let k=+c.dataset.a;k<=+c.dataset.b;k++){if(c.checked)p[k]=1;else delete p[k]}save();render()};
$("rz").onclick=()=>{if(confirm(T[S.lang].conf)){delete P[S.mode];save();render()}};
$("bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,s:S,p:P})],{type:"application/json"}));a.download="piibel_varukoopia_"+fmt(new Date())+".json";document.body.appendChild(a);a.click();a.remove()};
$("rs").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.p)throw 0;P=d.p;S=Object.assign(def(),d.s||{});save();ui();alert(T[S.lang].ok)}catch(x){alert(T[S.lang].err)}};r.readAsText(f);e.target.value=""};
ui();

</script></body></html>
